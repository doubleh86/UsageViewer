<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font:13px/1.5 'Segoe UI','Malgun Gothic',sans-serif;color:#edf2f8;font-variant-numeric:tabular-nums}
.uv-window{padding:16px;background:#171d25;border:1px solid #303946;border-radius:12px;overflow:hidden}strong{font-weight:600}button,input{font:inherit}button{color:#a8b5c6;background:transparent;border:0;border-radius:5px;min-width:26px;min-height:26px;display:inline-flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}button:hover{background:#2b3441}button:focus-visible,input:focus-visible{outline:2px solid #73dec1;outline-offset:1px}button:disabled{opacity:.5;cursor:default}button svg{width:14px;height:14px}
header,footer,.uv-line,.uv-brand,.uv-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}header{padding-bottom:10px}.uv-actions{gap:2px;flex-shrink:0}.uv-provider{padding:12px 0;border-top:1px solid #303946}.uv-brand{justify-content:flex-start;margin-bottom:9px}.uv-brand>.uv-muted{margin-left:auto;font-size:11px}.uv-muted{color:#a8b5c6;font-weight:400}.uv-mark{width:17px;text-align:center;font-weight:600}.uv-codex{color:#73dec1}.uv-claude{color:#dfaa8b}.uv-small{font-size:11px}.uv-track{height:4px;background:#303946;margin:7px 0 6px;border-radius:2px;overflow:hidden}.uv-track>span{display:block;height:100%;background:#73dec1}.uv-cl-track>span{background:#dfaa8b}.uv-stale .uv-track>span{background:#7d8898}.uv-line{min-width:0}.uv-line>span{min-width:0}.uv-line>strong{flex-shrink:0}
footer{font-size:11px;color:#a8b5c6;border-top:1px solid #303946;padding-top:10px;flex-wrap:wrap;gap:6px}.uv-view-toggle{display:flex;align-items:center;gap:6px;font-size:11px;color:#a8b5c6;cursor:pointer}.uv-view-toggle input{margin:0;width:12px;height:12px;accent-color:#73dec1;cursor:pointer}.uv-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px}.uv-detected{font-size:11px;color:#a8b5c6}.uv-tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}.uv-tabs button{padding:3px 6px}.uv-tabs button[aria-pressed=true]{color:#edf2f8;background:#2d3744;font-weight:600}.uv-tab-panel{padding:8px 0 12px}.uv-main-value{font-size:24px;letter-spacing:-.6px}.uv-main-value small{font-size:11px;letter-spacing:0;font-weight:400;color:#a8b5c6}.uv-credit{margin-top:15px;font-size:12px}.uv-empty{font-size:12px;color:#a8b5c6;padding:2px 0;overflow-wrap:anywhere}.uv-connect{color:#73dec1;padding:0;min-height:24px;text-decoration:underline}.uv-warning{color:#efc77f;font-size:11px;margin-top:6px}.uv-tab-panel .uv-warning{margin-bottom:6px}.uv-subtle{opacity:.75}.uv-unsupported{padding:8px 0}.uv-unsupported .uv-brand{margin:0}.uv-unsupported .uv-small{padding:4px 0 0 25px}#app{width:100%}
.uv-window.uv-docked{border-top:0;border-radius:0 0 12px 12px;padding-top:12px}
.uv-limits{font-size:10px;color:#a8b5c6;margin:0 0 7px;overflow-wrap:anywhere}
.uv-track.uv-low>span{background:#f88b98}.uv-track.uv-critical>span{background:#ff697e}.uv-alert-note{margin:7px 0;padding:6px 8px;border-radius:5px;background:#3d202a;color:#ffbdc5;font-size:11px;overflow-wrap:anywhere}.uv-alert-note.uv-critical{background:#5c2430;color:#ffd8dd}
.uv-weekly-status{margin-top:6px;font-size:11px;overflow-wrap:anywhere}.uv-help{margin-top:10px;color:#a8b5c6;font-size:11px;overflow-wrap:anywhere}.uv-help summary{cursor:pointer;min-height:26px;line-height:26px}.uv-help summary:focus-visible{outline:2px solid #73dec1}.uv-help p{margin:3px 0 0}.uv-limit{margin-top:12px;overflow-wrap:anywhere}.uv-limit:first-child{margin-top:0}
.uv-provider-status{margin:0 0 8px;overflow-wrap:anywhere}.uv-provider-status .uv-connect{display:block}
.uv-track{position:relative;overflow:visible}.uv-track>span{border-radius:2px}.uv-daily-marker{position:absolute;left:0;top:-3px;width:2px;height:10px;background:#edf2f8;border-radius:1px;transform:translateX(-50%);box-shadow:0 0 0 1px #171d25}
.uv-credit-confirmed{color:#7aaeff}.uv-credit-detail{color:#a8b5c6;font-size:11px;margin-top:3px;overflow-wrap:anywhere}.uv-credit-notice{margin:7px 0;padding:6px 8px;border-radius:5px;background:#202c3b;color:#c2d8f6;font-size:11px;overflow-wrap:anywhere}.uv-credit-notice.uv-credit-confirmed{background:#172d4c;color:#a9ceff}
.uv-work-line,.uv-work-scope{color:#a8b5c6;font-size:11px;margin:5px 0;overflow-wrap:anywhere}.uv-work-row{padding:6px 0;border-top:1px solid #303946;overflow-wrap:anywhere}.uv-work-row strong{color:#edf2f8}.uv-work-count{font-size:20px;color:#a0efdc}.uv-work-mode{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}.uv-work-mode .uv-tabs{flex-shrink:0}
.uv-start-marker{position:absolute;top:-5px;width:2px;height:14px;background:#7aaeff;border-radius:1px;transform:translateX(-50%);box-shadow:0 0 0 1px #171d25;z-index:1}.uv-daily-marker{z-index:2}.uv-marker-legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin:5px 0 0;color:#a8b5c6;font-size:10px;line-height:15px}.uv-marker-legend>span{display:inline-flex;align-items:center;gap:4px}.uv-marker-legend i{display:inline-block;width:2px;height:9px;background:#edf2f8;border-radius:1px}.uv-marker-legend .uv-start-key{height:12px;background:#7aaeff}
</style></head>
<body><main id="app" class="uv-window" aria-label="AI 사용량"><header><strong>Usage</strong></header><div class="uv-empty">설치된 AI 확인 중…</div></main>
<script>
(()=>{
 const app=document.getElementById('app');
 const helpOpen=new Set();
 let state={showBoth:true,activeProvider:'codex',providers:[],refreshing:false};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const percent=n=>Number.isFinite(n)&&n>=0&&n<=100?(n>0&&n<0.1?'0.1% 미만':Number(n).toLocaleString('en-US',{maximumFractionDigits:1})+'%'):'—';
 function send(message){if(window.chrome?.webview)window.chrome.webview.postMessage(message)}
 function resize(){requestAnimationFrame(()=>send({type:'resize',height:Math.ceil(app.getBoundingClientRect().height)}))}
 const refreshIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 5M20 3v5h-5"/></svg>';
 const closeIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>';
 function actions(){return '<div class="uv-actions"><button type="button" data-action="refresh" aria-label="새로고침" aria-busy="'+(state.refreshing===true)+'">'+refreshIcon+'</button><button type="button" data-action="hide" aria-label="숨기기">'+closeIcon+'</button></div>'}
 function tabs(){
  const usage=state.showBoth||!state.providers.length?'<button type="button" data-tab="usage" aria-pressed="'+!state.workTab+'">Usage</button>':state.providers.map(p=>'<button type="button" data-provider="'+esc(p.id)+'" aria-pressed="'+(!state.workTab&&p.id===state.activeProvider)+'">'+esc(p.name)+'</button>').join('');
  return '<div class="uv-tabs" role="group" aria-label="상세 탭">'+usage+'<button type="button" data-tab="work" aria-pressed="'+(state.workTab===true)+'">작업</button></div>';
 }
 function workText(work){
  let label=Number.isInteger(work.running)?(work.partial?'관측 진행 ':'진행 ')+work.running+'건':work.status;
  if(work.waiting>0)label+=' · 대기 '+work.waiting+'건';
  return label;
 }
 function providerWork(p){return p.work?'<div class="uv-work-line">작업 · '+esc(workText(p.work))+'</div>':''}
 function workPanel(){
  const work=state.work;
  if(!work)return '<section class="uv-tab-panel uv-empty">작업 신호 확인 중</section>';
  const running=Number.isInteger(work.running)?'<strong class="uv-work-count">'+work.running+'건</strong>':esc(work.status);
  const waiting=work.waiting>0?'<div class="uv-work-line">확인된 대기 '+work.waiting+'건 · 진행 합계 제외</div>':'';
  const scope='<div class="uv-work-scope">공식 훅을 연결한 로컬 세션의 최근 관측만 표시합니다.</div>';
  return '<section class="uv-tab-panel" aria-label="작업 현황"><div class="uv-line"><span>'+(work.partial?'연동된 작업 중':'전체 진행')+'</span><span>'+running+'</span></div>'+waiting+scope+
    '<div class="uv-line uv-work-row"><strong>Codex</strong><span>'+esc(workText(work.codex))+'</span></div>'+
    '<div class="uv-line uv-work-row"><strong>Claude</strong><span>'+esc(workText(work.claude))+'</span></div></section>';
 }
 function workMode(){
  return '<div class="uv-work-mode"><span>상단 작업 수</span><div class="uv-tabs" role="group" aria-label="상단 작업 수">'+
    '<button type="button" data-work-total="false" aria-pressed="'+!state.totalWorkMode+'">앱별</button>'+
    '<button type="button" data-work-total="true" aria-pressed="'+(state.totalWorkMode===true)+'">전체</button></div></div>';
 }
 function brand(p){return '<div class="uv-brand"><span class="uv-mark uv-'+esc(p.id)+'">'+(p.id==='codex'?'C':p.id==='claude'?'✳':'·')+'</span><strong>'+esc(p.name)+'</strong><span class="uv-muted">'+esc(p.plan||'감지됨')+'</span></div>'}
 function meter(p,w){
  if(w.invalid||w.expired)return '<div class="uv-small uv-muted">'+(w.invalid?'잔여량 확인 필요':p.web?'초기화 후 새 값 확인 중':'새 수신 필요')+'</div>';
  let marker='',legend='';
  const daily=w.weekly&&!p.stale&&!p.error&&!w.pacingReason&&Number.isFinite(w.remaining)&&w.remaining>=0&&w.remaining<=100;
  if(daily&&Number.isFinite(w.dailyStartRemaining)&&w.dailyStartRemaining>=0&&w.dailyStartRemaining<=100){
   const label='오늘 첫 조회 기준 '+percent(w.dailyStartRemaining)+' 남음';
   marker='<i class="uv-start-marker" role="img" aria-label="'+esc(label)+'" title="'+esc(label)+'" style="left:'+w.dailyStartRemaining+'%"></i>';
   legend='<span title="'+esc(label)+'"><i class="uv-start-key" aria-hidden="true"></i>오늘 시작 '+percent(w.dailyStartRemaining)+'</span>';
  }
  if(daily&&w.remaining>0&&Number.isFinite(w.dailyBoundaryRemaining)){
   const boundary=Math.max(0,Math.min(w.remaining,w.dailyBoundaryRemaining));
   const label='오늘 권장량 사용 후 '+percent(boundary)+' 남음';
   marker+='<i class="uv-daily-marker" role="img" aria-label="'+esc(label)+'" title="'+esc(label)+'" style="left:'+boundary+'%"></i>';
   if(legend)legend+='<span title="'+esc(label)+'"><i aria-hidden="true"></i>권장선</span>';
  }
  return '<div class="uv-track '+(p.id==='claude'?'uv-cl-track ':'')+(w.alert==='critical'?'uv-critical':w.alert==='warning'?'uv-low':'')+'"><span style="width:'+Math.max(0,Math.min(100,w.remaining))+'%"></span>'+marker+'</div>'+(legend?'<div class="uv-marker-legend">'+legend+'</div>':'');
 }
 function alertNotice(p){
  const low=p.windows.filter(w=>w.alert==='critical'||w.alert==='warning').sort((a,b)=>a.remaining-b.remaining);if(!low.length)return '';
  const backed=w=>p.id==='codex'&&w.remaining===0&&w.creditBacked&&!w.invalid&&!w.expired&&!p.stale&&!p.error;
  const w=low.find(w=>!backed(w))||low[0],critical=w.alert==='critical';
  if(backed(w))return '<div class="uv-credit-notice '+(p.creditConfirmed?'uv-credit-confirmed':'')+'">구독 한도 소진 · '+esc(p.creditLabel||'크레딧 잔액 보유')+'</div>';
  return '<div class="uv-alert-note '+(critical?'uv-critical':'')+'">! '+(critical?'레드 얼럿':'사용량 주의')+' · '+esc(w.shortName)+' '+percent(w.remaining)+' 남음</div>';
 }
 function pacing(p){if(!p.pacing)return '';const a=p.pacing;return (a.level==='unavailable'&&!p.windows.some(w=>w.weekly)?'<div class="uv-warning">'+esc(a.reason||a.message)+'</div>':'')+'<details class="uv-help" data-help="'+esc(p.id)+'" '+(helpOpen.has(p.id)?'open':'')+'><summary>오늘 권장량은 뭔가요?</summary><p>'+esc(a.basis)+'</p></details>'}
 function limit(p,w,large){
  const value=w.expired||w.invalid?(p.web&&w.expired?'갱신 중':'갱신 필요'):percent(w.remaining)+' <small>남음</small>';
  let html='<div class="uv-limit"><div class="uv-line"><span class="uv-muted">'+esc(w.name)+'</span><strong class="'+((large||w.weekly)&&!w.expired&&!w.invalid?'uv-main-value':'')+'">'+value+'</strong></div>'+meter(p,w);
  if(w.weekly){
   html+='<div class="'+(w.pacingReason?'uv-warning':'uv-weekly-status')+'">'+esc(w.pacingMessage||'추천 페이스 보류 · 최신 주간 정보 필요');
   if(w.tomorrowMessage&&!w.pacingReason&&!w.invalid&&!w.expired&&!p.stale&&!p.error)html+='<br><span class="uv-muted">'+esc(w.tomorrowMessage)+'</span>';
   html+='</div>';
  }
  if(w.shortTermWarning)html+='<div class="uv-warning">'+esc(w.shortTermWarning)+'</div>';
  if(!w.weekly&&w.pacingReason)html+='<div class="uv-warning">'+esc(w.pacingReason)+'</div>';
  return html+'<div class="uv-small uv-muted">'+esc(w.resetText)+'</div></div>';
 }
 function usage(p,large){
  let html=p.web&&p.status?'<div class="uv-warning uv-provider-status">'+(p.previous?'이전 값 · ':'')+esc(p.status)+(p.canConnect?'<button type="button" class="uv-connect" data-action="connect" data-id="claude">연결 창 열기</button>':'')+'</div>':'';
  html+=p.windows.length?p.windows.map((w,i)=>limit(p,w,large&&i===0)).join(''):p.web&&p.status?'':empty(p);
  if(p.credits!=null)html+='<div class="uv-line uv-credit"><span class="'+(p.creditConfirmed&&!p.stale&&!p.error?'uv-credit-confirmed':'uv-muted')+'">'+esc(p.creditLabel||'크레딧')+'</span><strong>'+esc(p.credits)+'</strong></div>';
  if(p.creditDetail&&!p.stale&&!p.error)html+='<div class="uv-credit-detail">'+esc(p.creditDetail)+'</div>';
  if(!p.web&&p.windows.length&&(p.error||p.stale))html+='<div class="uv-warning">'+esc(p.error||'이전 수신 값')+'</div>'+(p.canConnect?'<button type="button" class="uv-connect" data-action="connect" data-id="'+esc(p.id)+'">다시 연결</button>':'');
  return html+alertNotice(p)+pacing(p);
 }
 function coverage(p){return p.coverage?'<div class="uv-limits">'+esc(p.coverage)+'</div>':''}
 function empty(p){return '<div class="uv-empty">'+esc(p.error||'사용량 확인 중…')+'</div>'+(p.canConnect?'<button type="button" class="uv-connect" data-action="connect" data-id="'+esc(p.id)+'">'+(p.id==='codex'?'ChatGPT 연결하기':'연결하기')+'</button>':'')}
 function combined(p){
  if(!p.supported)return '<section class="uv-provider uv-unsupported">'+brand(p)+'<div class="uv-muted uv-small">감지됨 · 사용량 연동 미지원</div></section>';
  return '<section class="uv-provider '+(p.stale?'uv-stale':'')+'">'+brand(p)+providerWork(p)+coverage(p)+usage(p,false)+'</section>';
 }
 function tabbed(p){
  if(!p.supported)return '<section class="uv-tab-panel">'+empty(p)+'</section>';
  return '<section class="uv-tab-panel '+(p.stale?'uv-stale':'')+'">'+providerWork(p)+coverage(p)+usage(p,true)+'</section>';
 }
 function render(){
  app.classList.toggle('uv-docked',state.docked===true);
  if(!state.providers.some(p=>p.id===state.activeProvider))state.activeProvider=state.providers[0]?.id||'codex';
  const selected=state.providers.find(p=>p.id===state.activeProvider);
  const panel=state.workTab?workPanel():state.providers.length?(state.showBoth?state.providers.map(combined).join(''):tabbed(selected)):'<div class="uv-empty">지원하는 AI 설치를 찾지 못했습니다. 설치 후 새로고침해 주세요.</div>';
  const footer=state.workTab?'':'<span aria-live="polite">'+esc(state.showBoth?state.providers.filter(p=>p.updated).map(p=>p.name+' '+p.updated).join(' · ')||'자동 탐지 완료':selected?.updated?selected.name+' '+selected.updated:'연결 상태 확인')+'</span><span>남은 비율 기준</span>';
  app.innerHTML='<header>'+tabs()+actions()+'</header>'+panel+'<footer>'+footer+'</footer><div class="uv-controls"><label class="uv-view-toggle"><input type="checkbox" id="show-both" '+(state.showBoth?'checked':'')+'>함께 보기</label><span class="uv-detected">'+state.providers.length+'개 감지</span></div>'+workMode()+(state.preferencesError?'<div class="uv-warning">'+esc(state.preferencesError)+'</div>':'');
  resize();
 }
 app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.dataset.provider){state.activeProvider=button.dataset.provider;state.workTab=false;send({type:'provider',id:state.activeProvider});render();return}
  if(button.dataset.tab){state.workTab=button.dataset.tab==='work';send({type:'detail-tab',id:button.dataset.tab});render();return}
  if(button.dataset.workTotal!==undefined){state.totalWorkMode=button.dataset.workTotal==='true';send({type:'work-mode',total:state.totalWorkMode});render();return}
  send({type:button.dataset.action,id:button.dataset.id});
 });
 app.addEventListener('toggle',e=>{if(e.target.matches('details[data-help]')){if(e.target.open)helpOpen.add(e.target.dataset.help);else helpOpen.delete(e.target.dataset.help);resize()}},true);
 app.addEventListener('change',e=>{if(e.target.id==='show-both'){state.showBoth=e.target.checked;send({type:'mode',showBoth:state.showBoth});render()}});
 window.usageViewer={update(data){state=data;render()}};
 window.addEventListener('resize',resize);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')send({type:'hide'})});
 render();send({type:'ready'});
})();
</script></body></html>
